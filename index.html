const pages={about:`<div class="stamp">PERSONAL FILE / 001</div><h1 id="fileTitle">Hello, I’m Weitong Li.</h1><p>你好，我是 Weitong Li。本科数学，硕士应用统计，正在探索 AI 产品与 Agent。</p><p>这个网站用来记录我的项目、学习与想法。你可以从不同案卷中，看看我如何理解问题、设计流程，并把想法逐步做出来。</p><div class="tags"><span>数学</span><span>应用统计</span><span>AI 产品</span><span>Agent</span></div><h2>正在做的事</h2><p>Career Agent、OneLine，以及赛车手主题数字宠物 Driver Petdex。</p><p class="note">个人介绍为初稿；兴趣、照片和更具体的故事将在下一轮补充。</p>`,projects:`<div class="stamp">CASE FILES / INDEX</div><h1 id="fileTitle">项目案卷</h1><p>每份案卷记录一个问题，以及围绕它的设计与尝试。</p><button class="back" data-open="career">01 / Career Agent ↗</button> <button class="back" data-open="one">02 / OneLine ↗</button> <button class="back" data-open="pet">03 / Driver Petdex ↗</button>`,career:window.careerAgentCase,one:window.oneLineCase,pet:`<div class="stamp">CASE FILE / 003 · MOTORSPORT × PETS</div><h1 id="fileTitle">Driver Petdex</h1><p class="subtitle">赛车手主题数字宠物</p><p>以 F1 赛车手 Oscar Piastri 为原型的 Q 版 Codex 桌面宠物，在不同状态下呈现与方程式赛车相关的动作。包含 9 种动画状态和 16 个观察方向，适合 81 蜜和木瓜丝们。</p><div class="pia-layout"><div class="pia-stage"><span class="pia-stage-label">PIA / PADDOCK NOTES</span><button class="pia-sprite" type="button" aria-label="Pia：维修区待命；点击挥手"></button><div class="pia-shadow" aria-hidden="true"></div><span class="pia-stage-foot">点击小赛车手，让他向你挥手</span><p id="pia-error" class="pia-error" role="status" hidden></p></div><section aria-label="Pia 动画控制"><h2 class="pia-control-title" id="pia-state-name">维修区待命</h2><p class="pia-state-description" id="pia-state-desc" aria-live="polite">暂时没有任务，和小赛车一起等候。</p><div class="pia-state-grid" aria-label="选择动画状态"><button type="button" data-pia-state="idle" aria-pressed="true">维修区待命</button><button type="button" data-pia-state="running-right" aria-pressed="false">向右开车</button><button type="button" data-pia-state="running-left" aria-pressed="false">向左开车</button><button type="button" data-pia-state="waving" aria-pressed="false">向你挥手</button><button type="button" data-pia-state="jumping" aria-pressed="false">跳跃庆祝</button><button type="button" data-pia-state="failed" aria-pressed="false">失误沮丧</button><button type="button" data-pia-state="waiting" aria-pressed="false">等待指令</button><button type="button" data-pia-state="running" aria-pressed="false">专注驾驶</button><button type="button" data-pia-state="review" aria-pressed="false">赛后检查</button></div><button id="pia-play" class="pia-play" type="button" aria-pressed="true">暂停动画</button><div class="pia-direction"><label for="pia-direction">16 个观察方向</label><input id="pia-direction" type="range" min="0" max="15" step="1" value="0"><span id="pia-direction-name">拖动滑块，让 Pia 看向不同方向</span></div></section></div><div class="pia-links"><a href="https://petdex.dev/pets/pia" target="_blank" rel="noopener noreferrer">在 Petdex 查看 Pia ↗</a><a href="https://github.com/calmandslow/pia-petdex" target="_blank" rel="noopener noreferrer">查看 GitHub ↗</a><a href="assets/pia/pia.zip" download="pia.zip">下载宠物资源 ↓</a></div><p class="pia-caption">9 种动画状态 · 16 个观察方向 · Codex 桌面宠物</p><details class="project-detail"><summary>如何带到自己的桌面</summary><p>解压下载的资源包，将 pet.json 和 spritesheet.webp 放入 ~/.codex/pets/pia/，再在 Codex 的 Settings → Appearance → Pets 中选择 Pia。</p><p class="note">完整说明见 GitHub README。网页中的状态切换用于预览动画；桌面上的实际反馈由宠物运行环境驱动。</p></details>`,notes:`<div class="stamp">FIELD NOTES / 2026</div><h1 id="fileTitle">Private notes.</h1><div class="flow">Curious people.<br>Meaningful problems.<br>Useful tools.<br>A kinder tomorrow.</div><p>这里记录我的学习、想法与未完成的探索。</p><article class="future-note" aria-labelledby="career-outlook"><p class="note"><time datetime="2026-10-12">2026.10.12</time> / 项目展望</p><h2 id="career-outlook">Career Agent：我想把它带到哪里</h2><p>我希望 Career Agent 能陪伴一次完整的求职过程：发现合适的机会，准备并练习面试，跟进投递，再把真实面试中的经验带到下一次准备中。</p><h3>01 / 让模拟面试更接近真实交流</h3><p>未来想在模拟面试中加入语音和视频，让练习从文字回答延伸到实时对话，也有机会练习表达节奏和临场组织。更进一步，可以加入模拟面试官形象，让练习更有面对面交流的感觉。</p><h3>02 / 从发现岗位到跟进投递</h3><p>希望它能根据求职方向，每天关注岗位上新，帮助我发现值得进一步了解的机会。同时记录每个岗位的投递状态、面试轮次和后续事项，把岗位发现、材料准备与投递跟踪连接起来。</p><h3>03 / 把真实面试变成下一次准备的依据</h3><p>面试结束后，根据真实面试记录与反馈，整理被问到的问题、回答中的不足，以及需要继续补充的经历和知识。让复盘形成具体的改进方向，回到下一轮回答准备和模拟练习中。</p><h3>04 / 从多次求职中积累自己的经验</h3><p>随着岗位和面试记录积累，我希望它能跨岗位总结反复出现的问题、不同岗位的考察重点，以及自己在表达和能力上的共性短板。让每次准备都能用上过去的经验，而不必重新开始。</p><div class="flow future-loop">发现岗位 → 准备与模拟 → 投递跟踪<br>→ 真实面试复盘 → 积累经验 → 下一轮准备</div><p>最终想做的是一个能持续积累个人求职经验的助手，让每一次投递和面试，都成为下一次准备的起点。</p><p class="note">这篇手记记录的是未来方向；语音视频、模拟形象、岗位监控与真实面试复盘仍是后续计划。</p></article>`,contact:`<div class="stamp">CORRESPONDENCE / PRIVATE LETTER</div><h1 id="fileTitle">Keep in touch.</h1><p>欢迎交流 AI、产品、赛车与有趣的想法。</p><p>联系方式尚未填写。</p><p class="note">下一轮可加入你希望展示的邮箱、GitHub 或其他链接。</p>`};
const dialog=document.querySelector('dialog'),content=document.querySelector('#content');let opener;let stopPetPreview=()=>{};
function openFile(key){if(!pages[key])return;stopPetPreview();stopPetPreview=()=>{};if(!dialog.open)opener=document.activeElement;dialog.classList.toggle('project-file',key==='career'||key==='one'||key==='pet');content.innerHTML=pages[key];if(key==='pet')stopPetPreview=window.startPiaPreview(content);if(!dialog.open)dialog.showModal();dialog.scrollTop=0;document.querySelector('.close').focus();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openFile(b.dataset.open);if(e.target.closest('[data-one-reset]')){const frame=content.querySelector('#one-prototype');if(frame)frame.src='prototypes/oneline-original.html';}const careerSection=e.target.closest('[data-career-section]');if(careerSection){const target=content.querySelector('#career-'+careerSection.dataset.careerSection);if(target){target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});target.focus({preventScroll:true});}}const section=e.target.closest('[data-one-section]');if(section){const target=content.querySelector('#one-'+section.dataset.oneSection);if(target){target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});target.focus({preventScroll:true});}}});document.querySelector('.close').onclick=()=>dialog.close();document.querySelector('.sheet > .back').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{stopPetPreview();stopPetPreview=()=>{};content.querySelectorAll('iframe').forEach(frame=>frame.remove());opener?.isConnected&&opener.focus()});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
const board=document.querySelector('.board'),lens=document.querySelector('.lens');let enabled=false;function setLens(){enabled=!enabled;document.querySelector('#magnifier').setAttribute('aria-pressed',enabled);document.querySelector('#lensToggle').setAttribute('aria-pressed',enabled);document.querySelector('#lensToggle').textContent='放大镜：'+(enabled?'开启':'关闭');document.querySelector('#status').textContent=enabled?'移动指针或在画面上拖动，查看纸面细节。':'从个人档案开始，或直接打开一份项目案卷。';lens.style.display=enabled?'block':'none';if(enabled)move({clientX:board.getBoundingClientRect().left+board.clientWidth*.70,clientY:board.getBoundingClientRect().top+board.clientHeight*.15})}function move(e){if(!enabled)return;const r=board.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left)),y=Math.max(0,Math.min(r.height,e.clientY-r.top)),size=lens.clientWidth,crop=r.width*75/1536;lens.style.left=x-lens.offsetWidth/2+'px';lens.style.top=y-lens.offsetHeight/2+'px';lens.style.backgroundSize=r.width*2+'px '+(r.height+crop)*2+'px';lens.style.backgroundPosition=(size/2-x*2)+'px '+(size/2-(y+crop)*2)+'px'}document.querySelector('#magnifier').onclick=setLens;document.querySelector('#lensToggle').onclick=setLens;board.addEventListener('pointermove',move);board.addEventListener('pointerdown',move);
document.querySelectorAll('.spot[data-open]').forEach(el=>{function highlight(on){document.querySelectorAll('.spot[data-open]').forEach(other=>{if(other.dataset.open===el.dataset.open)other.classList.toggle('related',on)})}el.addEventListener('pointerenter',()=>highlight(true));el.addEventListener('pointerleave',()=>highlight(false));el.addEventListener('focus',()=>highlight(true));el.addEventListener('blur',()=>highlight(false))});
const initialFile=location.hash.slice(1);if(pages[initialFile])openFile(initialFile);
</script></body></html>
